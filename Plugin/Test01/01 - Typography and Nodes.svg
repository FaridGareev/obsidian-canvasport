<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="2740" height="1720" viewBox="0 0 2740 1720"><defs><pattern id="canvas_grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#333333"/></pattern><marker id="canvas_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#1c1c1c"/><rect width="100%" height="100%" fill="url(#canvas_grid)"/><g><rect x="80" y="80" width="2580" height="1560" rx="8" fill="#a882ff12"/><rect x="80" y="80" width="2580" height="1560" rx="8" fill="none" stroke="#a882ff"/><g><rect x="88" y="67.76" width="423.15999999999997" height="26.099999999999998" rx="5" fill="#a882ff"/><text x="96" y="86.48" fill="#1e1e1e" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Typography, Markdown, and Node Geometry</text></g></g><g stroke-linecap="round" stroke-linejoin="round"><path d="M 1130 330 C 1130 375, 360 375, 360 420" fill="none" stroke="#fb464c" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="690.5" y="362" width="109" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="745" y="373" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">heading scale</text></g><path d="M 540 575 C 640 575, 720 575, 820 575" fill="none" stroke="#e9973f" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="625.5" y="562" width="109" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="680" y="573" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">inline styles</text></g><path d="M 1180 575 C 1280 575, 1405 575, 1505 575" fill="none" stroke="#e0de71" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="1271" y="562" width="144" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="1343" y="573" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">structured content</text></g><path d="M 1865 575 C 1965 575, 2055 575, 2155 575" fill="none" stroke="#44cf6e" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="1948.5" y="562" width="123" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="2010" y="573" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">semantic blocks</text></g><path d="M 680 935 C 780 935, 780 935, 880 935" fill="none" stroke="#53dfdd" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="743" y="922" width="74" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="780" y="933" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">overflow</text></g><path d="M 1230 935 C 1330 935, 1405 835, 1505 835" fill="none" stroke="#a882ff" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="1313.5" y="872" width="109" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="1368" y="883" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">size extremes</text></g><path d="M 1635 835 C 1732.5 835, 1732.5 875, 1830 875" fill="none" stroke="#fb464c" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="1696" y="842" width="74" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="1733" y="853" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">geometry</text></g><path d="M 430 1070 C 430 1140, 500 1140, 500 1210" fill="none" stroke="#e0de71" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="410.5" y="1127" width="109" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="465" y="1138" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">complete note</text></g><path d="M 1055 1070 C 1055 1140, 1190 1140, 1190 1210" fill="none" stroke="#44cf6e" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="1061.5" y="1127" width="123" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="1123" y="1138" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">heading subpath</text></g><path d="M 2155 935 C 2155 1035, 2155 1110, 2155 1210" fill="none" stroke="#53dfdd" stroke-width="2" marker-end="url(#canvas_arrow)"/><g><rect x="2107.5" y="1060" width="95" height="22" rx="4" fill="#1c1c1c" stroke="#7e7e7e"/><text x="2155" y="1071" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">nested path</text></g></g><g><rect x="180" y="180" width="1900" height="150" rx="7" fill="#26232c" stroke="#7e63bb"/><text x="190" y="200" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="190" dy="0">Typography and Node Test Every card below isolates a formatting or geometry case. The export should stay readable, aligned, clipped, and visually consistent in light and dark themes.</tspan></text></g><g><rect x="180" y="420" width="360" height="310" rx="7" fill="#2c1f1f" stroke="#b8393e"/><text x="190" y="440" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="190" dy="0">Heading One Heading Two Heading Three Heading</tspan><tspan x="190" dy="16">Four Body text follows the complete heading</tspan><tspan x="190" dy="16">scale.</tspan></text></g><g><rect x="1830" y="815" width="650" height="120" rx="7" fill="#2a251e" stroke="#ac7235"/><text x="1840" y="835" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="1840" dy="0">Extra-wide node A wide card checks horizontal composition, border radius, line length, and</tspan><tspan x="1840" dy="16">edge anchoring.</tspan></text></g><g><rect x="820" y="420" width="360" height="310" rx="7" fill="#2a251e" stroke="#ac7235"/><text x="830" y="440" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="830" dy="0">Inline Formatting Bold text Italic text</tspan><tspan x="830" dy="16">Strikethrough inline code External link</tspan><tspan x="830" dy="16">(https://obsidian.md)</tspan></text></g><g><rect x="1505" y="420" width="360" height="310" rx="7" fill="#2a2a22" stroke="#a5a458"/><text x="1515" y="440" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="1515" dy="0">Lists and Tasks 1. First ordered item 2. Second</tspan><tspan x="1515" dy="16">ordered item - Parent item - Nested item - [x]</tspan><tspan x="1515" dy="16">Complete - [ ] Incomplete</tspan></text></g><g><rect x="2155" y="420" width="360" height="310" rx="7" fill="#1f2922" stroke="#389955"/><text x="2165" y="440" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="2165" dy="0">Quote and Divider Good exports preserve</tspan><tspan x="2165" dy="16">hierarchy, spacing, and contrast. --- A divider</tspan><tspan x="2165" dy="16">should remain subtle but visible.</tspan></text></g><g><rect x="880" y="800" width="350" height="270" rx="7" fill="#26232c" stroke="#7e63bb"/><text x="890" y="820" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="890" dy="0">Long Content This deliberately long paragraph</tspan><tspan x="890" dy="16">verifies predictable line wrapping and</tspan><tspan x="890" dy="16">clipping. It repeats enough information to</tspan><tspan x="890" dy="16">exceed a compact card without escaping its</tspan><tspan x="890" dy="16">border, covering neighboring nodes, or exposing</tspan><tspan x="890" dy="16">the Canvas grid through the surface. A</tspan><tspan x="890" dy="16">professional export should keep the visual</tspan><tspan x="890" dy="16">hierarchy intact even when source content is</tspan></text></g><g><rect x="180" y="800" width="500" height="270" rx="7" fill="#202a2a" stroke="#43a5a3"/><text x="190" y="820" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="190" dy="0">Code Block ts const output = await exportCanvas({ theme: &#39;dark&#39;,</tspan><tspan x="190" dy="16">scale: 2, }); The block must clip inside the card.</tspan></text></g><g><rect x="180" y="1210" width="640" height="350" rx="7" fill="#2a2a22" stroke="#a5a458"/><text x="190" y="1230" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="190" dy="0">Rich Markdown Fixture This note exercises the Markdown renderer with common Obsidian</tspan><tspan x="190" dy="16">content. Overview Use bold, italic, strikethrough, inline code, and a safe external link</tspan><tspan x="190" dy="16">(https://obsidian.md). A blockquote should have a visible accent line and comfortable</tspan><tspan x="190" dy="16">padding. Task list - [x] Completed export check - [ ] Pending visual review - [ ]</tspan><tspan x="190" dy="16">Compare light and dark themes Ordered list 1. Open the Canvas. 2. Select several output</tspan><tspan x="190" dy="16">formats. 3. Compare every export against Obsidian. Code block ts const formats =</tspan><tspan x="190" dy="16">[&#39;html&#39;, &#39;png&#39;, &#39;svg&#39;, &#39;pdf&#39;]; const ready = formats.every(Boolean); Table | Format |</tspan><tspan x="190" dy="16">Vector | Transparent | | --- | ---: | ---: | | SVG | Yes | Yes | | PDF | Yes | No | |</tspan></text></g><g><rect x="940" y="1210" width="500" height="220" rx="7" fill="#1f2922" stroke="#389955"/><text x="950" y="1230" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="950" dy="0">Selected section This heading is used by a Canvas file node with a</tspan><tspan x="950" dy="16">heading subpath. - Only this section should appear in the</tspan><tspan x="950" dy="16">selected-section card. - Content from the next heading must not leak</tspan><tspan x="950" dy="16">into the export. Selected subsection Nested content belongs to the</tspan><tspan x="950" dy="16">selected section.</tspan></text></g><g><rect x="1905" y="1210" width="500" height="220" rx="7" fill="#202a2a" stroke="#43a5a3"/><text x="1915" y="1230" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="1915" dy="0">Embedded section The exporter should show this sentence without</tspan><tspan x="1915" dy="16">exposing the frontmatter.</tspan></text></g><g><rect x="1505" y="800" width="130" height="70" rx="7" fill="#2c1f1f" stroke="#b8393e"/><text x="1515" y="820" fill="#dadada" font-family="Inter,Segoe UI,sans-serif" font-size="13"><tspan x="1515" dy="0">Tiny node</tspan><tspan x="1515" dy="16">Clipped safely.</tspan></text></g></svg>